# ============================================================
# Debug Profile
# Maximum observability for troubleshooting
# ============================================================

project_name: "NeuralStream-Core"
version: "2.0.0"
debug: true
seed: 42
log_level: "DEBUG"
log_dir: "logs"

model:
  architecture: "edge_ae"
  in_channels: 1
  input_size: 64
  latent_dim: 32
  hidden_dims: [32, 64, 128]
  dropout_rate: 0.1

stream:
  format: "synthetic"
  batch_size: 4          # Tiny batches for readability
  shape: [1, 64, 64]
  buffer_size: 500
  shuffle: false

precision:
  initial_mode: "FP32"
  target_latency_ms: 3.0
  window_size: 10
  cooldown_ticks: 3
  enable_thermal_model: true

drift:
  methods: ["wasserstein", "mmd", "kl_divergence", "hellinger"]  # All methods
  sample_size: 200
  evaluation_interval: 1    # Evaluate every tick
  alert_threshold: 0.10
  critical_threshold: 0.25
  history_length: 500
  layer_names:
    - "encoder_conv.0"
    - "encoder_conv.2"
    - "encoder_fc.0"
    - "decoder_fc.0"

adaptation:
  error_threshold: 0.15
  buffer_capacity: 128
  micro_batch_size: 8
  learning_rate: 0.00001
  enable_ewc: true
  ewc_lambda: 0.5

anomaly:
  n_estimators: 100
  contamination: 0.05

ipc:
  ring_buffer_capacity: 200

telemetry:
  collection_interval_ms: 100.0
  history_length: 2000
  enable_cpu_tracking: true
  enable_memory_tracking: true
  enable_disk_tracking: true
  enable_network_tracking: true

dashboard:
  theme: "cyber_dark"
  refresh_rate_ms: 30
  max_sparkline_points: 200
  max_trajectory_points: 1000
  enable_3d_plots: true
  enable_heatmaps: true
  enable_oscilloscope: true

workers:
  num_inference_workers: 1
  num_adaptation_workers: 1
  num_drift_workers: 1
  task_queue_size: 100
  worker_timeout_s: 60.0